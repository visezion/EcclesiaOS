name: Build and Publish Container Images

on:
  pull_request:
    paths:
      - "app/**"
      - "bootstrap/**"
      - "config/**"
      - "database/**"
      - "docker/**"
      - "public/**"
      - "resources/**"
      - "routes/**"
      - "composer.json"
      - "composer.lock"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - "compose.yaml"
      - ".dockerignore"
      - ".env.docker.example"
      - ".github/workflows/docker.yml"
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  smoke:
    name: Compose deployment smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare isolated deployment environment
        shell: bash
        run: |
          cp .env.docker.example .env.docker
          APP_KEY="base64:$(openssl rand -base64 32 | tr -d '\n')"
          DB_PASSWORD="$(openssl rand -hex 24)"
          ROOT_PASSWORD="$(openssl rand -hex 32)"
          sed -i \
            -e "s|^APP_KEY=.*|APP_KEY=${APP_KEY}|" \
            -e "s|^DB_PASSWORD=.*|DB_PASSWORD=${DB_PASSWORD}|" \
            -e "s|^MYSQL_PASSWORD=.*|MYSQL_PASSWORD=${DB_PASSWORD}|" \
            -e "s|^MYSQL_ROOT_PASSWORD=.*|MYSQL_ROOT_PASSWORD=${ROOT_PASSWORD}|" \
            -e "s|^APP_PORT=.*|APP_PORT=18080|" \
            .env.docker

      - name: Validate Compose configuration
        run: docker compose --env-file .env.docker config --quiet

      - name: Build and start the complete stack
        run: docker compose --env-file .env.docker up -d --build

      - name: Wait for the application health endpoint
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18080/up >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Verify migrations, administration bootstrap, and queues
        run: |
          docker compose --env-file .env.docker exec -T app php artisan migrate:status
          docker compose --env-file .env.docker exec -T \
            -e BOOTSTRAP_ADMIN_NAME="CI Administrator" \
            -e BOOTSTRAP_ADMIN_EMAIL="ci-admin@example.org" \
            -e BOOTSTRAP_ADMIN_PASSWORD="ContainerPassword123" \
            app php artisan app:bootstrap-admin --no-interaction
          docker compose --env-file .env.docker exec -T app \
            php artisan app:bootstrap-admin --check --no-interaction
          docker compose --env-file .env.docker ps

      - name: Print service logs after failure
        if: failure()
        run: docker compose --env-file .env.docker logs --no-color

      - name: Remove test containers and volumes
        if: always()
        run: docker compose --env-file .env.docker down --volumes --remove-orphans

  containers:
    name: Build ${{ matrix.target }} image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: app
            image: ghcr.io/visezion/ecclesiaos-app
          - target: web
            image: ghcr.io/visezion/ecclesiaos-web

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Resolve application version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          provenance: true
          sbom: true
