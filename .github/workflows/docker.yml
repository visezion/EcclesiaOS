name: Build and Publish Container Images

on:
  pull_request:
    paths:
      - "app/**"
      - "bootstrap/**"
      - "config/**"
      - "database/**"
      - "docker/**"
      - "public/**"
      - "resources/**"
      - "routes/**"
      - "composer.json"
      - "composer.lock"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - "compose.yaml"
      - ".dockerignore"
      - ".env.docker.example"
      - ".github/workflows/docker.yml"
  push:
    branches:
      - "main"
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  smoke:
    name: Compose deployment smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Prepare isolated deployment environment
        shell: bash
        run: |
          cp .env.docker.example .env.docker
          APP_KEY="base64:$(openssl rand -base64 32 | tr -d '\n')"
          DB_PASSWORD="$(openssl rand -hex 24)"
          ROOT_PASSWORD="$(openssl rand -hex 32)"
          sed -i \
            -e "s|^APP_KEY=.*|APP_KEY=${APP_KEY}|" \
            -e "s|^DB_PASSWORD=.*|DB_PASSWORD=${DB_PASSWORD}|" \
            -e "s|^MYSQL_PASSWORD=.*|MYSQL_PASSWORD=${DB_PASSWORD}|" \
            -e "s|^MYSQL_ROOT_PASSWORD=.*|MYSQL_ROOT_PASSWORD=${ROOT_PASSWORD}|" \
            -e "s|^APP_PORT=.*|APP_PORT=18080|" \
            .env.docker
          printf '\nRUN_MIGRATIONS=false\n' >> .env.docker

      - name: Validate Compose configuration
        run: |
          composer validate --strict
          if git ls-files | grep -E '(^|/)\.env$|(^|/)database/.*\.sqlite([.-].*)?$|\.(tar|tar\.gz|tgz|zip)$'; then
            echo "::error::A sensitive environment, database, or archive file is tracked."
            exit 1
          fi
          docker compose --env-file .env.docker config --quiet

      - name: Build application images
        run: |
          docker compose --env-file .env.docker build --pull app
          docker compose --env-file .env.docker build --pull --no-cache web

      - name: Scan application images
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/trivy-cache"

          TRIVY_IMAGE="aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f"

          scan_status=0

          for service in app web; do
            image_name="$(
              docker compose --env-file .env.docker config --format json |
              jq -r --arg service "$service" '.services[$service].image'
            )"

            if [[ -z "$image_name" || "$image_name" == "null" ]]; then
              echo "::error::Unable to resolve image name for service: $service"
              exit 1
            fi

            echo "Scanning $service image: $image_name"

            docker image inspect "$image_name" >/dev/null

            report="$RUNNER_TEMP/trivy-$service.json"

            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
              "$TRIVY_IMAGE" image \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 0 \
              --format json \
              "$image_name" > "$report"

            findings="$(
              jq '
                [
                  .Results[]?.Vulnerabilities[]?
                  | select(
                      .Severity == "HIGH" or
                      .Severity == "CRITICAL"
                    )
                ]
                | length
              ' "$report"
            )"

            echo "$service findings: $findings"

            if [[ "$findings" -gt 0 ]]; then
              while IFS=$'\t' read -r pkg severity installed fixed; do
                echo "::error file=Dockerfile,line=1,title=$severity vulnerability::$service: $pkg $installed -> ${fixed:-no fixed version}"
              done < <(
                jq -r '
                  .Results[]?.Vulnerabilities[]?
                  | select(
                      .Severity == "HIGH" or
                      .Severity == "CRITICAL"
                    )
                  | [
                      .PkgName,
                      .Severity,
                      .InstalledVersion,
                      (.FixedVersion // "")
                    ]
                  | @tsv
                ' "$report"
              )

              scan_status=1
            fi
          done

          exit "$scan_status"

      - name: Start infrastructure and application
        run: |
          docker compose --env-file .env.docker up -d db redis
          docker compose --env-file .env.docker up -d app

      - name: Wait for the application container
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            app_container="$(docker compose --env-file .env.docker ps -q app)"
            app_status="$(docker inspect --format '{{.State.Status}}' "$app_container")"
            health_status="$(docker inspect --format '{{.State.Health.Status}}' "$app_container")"

            if [[ "$app_status" != "running" ]]; then
              docker compose --env-file .env.docker logs --no-color app
              exit 1
            fi

            if [[ "$health_status" == "healthy" ]]; then
              exit 0
            fi

            sleep 5
          done

          docker compose --env-file .env.docker logs --no-color app
          exit 1

      - name: Start remaining services
        run: docker compose --env-file .env.docker up -d web queue scheduler

      - name: Wait for the application health endpoint
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18080/up >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Run database migrations
        run: docker compose --env-file .env.docker exec -T app php artisan migrate --force

      - name: Verify migration status
        run: docker compose --env-file .env.docker exec -T app php artisan migrate:status

      - name: Bootstrap deployment administrator
        run: |
          docker compose --env-file .env.docker exec -T \
            -e BOOTSTRAP_ADMIN_NAME="CI Administrator" \
            -e BOOTSTRAP_ADMIN_EMAIL="ci-admin@example.org" \
            -e BOOTSTRAP_ADMIN_PASSWORD="ContainerPassword123" \
            app php artisan app:bootstrap-admin --no-interaction

      - name: Verify deployment administrator
        run: |
          docker compose --env-file .env.docker exec -T app \
            php artisan app:bootstrap-admin --check --no-interaction

      - name: Verify managed release layout
        run: |
          docker compose --env-file .env.docker exec -T app sh -ec \
            'test "$(cat VERSION)" = "$(cat /var/www/html/.managed/current/VERSION)"'

      - name: Verify running services
        run: docker compose --env-file .env.docker ps
          docker compose --env-file .env.docker ps

      - name: Print service logs after failure
        if: failure()
        run: docker compose --env-file .env.docker logs --no-color

      - name: Remove test containers and volumes
        if: always()
        run: docker compose --env-file .env.docker down --volumes --remove-orphans

  containers:
    name: Build ${{ matrix.target }} image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: app
            image: ghcr.io/visezion/ecclesiaos-app
          - target: web
            image: ghcr.io/visezion/ecclesiaos-web

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Resolve application version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          pull: true
          no-cache: ${{ matrix.target == 'web' }}
          provenance: true
          sbom: true
