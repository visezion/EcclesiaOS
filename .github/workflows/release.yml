name: Publish Application Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: "8.4"
          extensions: ctype, curl, dom, fileinfo, filter, gd, mbstring, openssl, pdo_sqlite, session, tokenizer, xml, zip
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm

      - name: Verify tag and version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          printf '%s\n' "$VERSION" > VERSION

      - name: Verify release version file
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME#v}" = "$(tr -d '\r\n' < VERSION)"

      - name: Install development dependencies
        run: |
          composer install --no-interaction --prefer-dist
          npm ci

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Verify application
        run: |
          composer validate --strict
          composer audit --locked
          npm audit
          php artisan test
          ./vendor/bin/pint --test
          npm run build

      - name: Reject sensitive repository artifacts
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env$|(^|/)database/.*\.sqlite([.-].*)?$|\.(tar|tar\.gz|tgz|zip)$'; then
            echo "::error::A sensitive environment, database, or archive file is tracked."
            exit 1
          fi

      - name: Install production PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Build release package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          ARTIFACT="ecclesiaos-v${VERSION}.zip"
          STAGE="$RUNNER_TEMP/ecclesiaos-release"
          mkdir -p "$STAGE" release-assets

          rsync -a ./ "$STAGE/" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='storage/' \
            --exclude='public/storage' \
            --exclude='database/*.sqlite*' \
            --exclude='*.tar' \
            --exclude='*.tar.gz' \
            --exclude='*.tgz' \
            --exclude='*.zip' \
            --exclude='release-assets/' \
            --exclude='.phpunit.result.cache'

          find "$STAGE/bootstrap/cache" -type f ! -name '.gitignore' -delete
          (cd "$STAGE" && zip -q -r "$GITHUB_WORKSPACE/release-assets/$ARTIFACT" .)

          SHA256="$(sha256sum "release-assets/$ARTIFACT" | awk '{print $1}')"
          MINIMUM_VERSION="$(tr -d '\r\n' < release/minimum-version.txt)"

          jq -n \
            --arg version "$VERSION" \
            --arg minimum_version "$MINIMUM_VERSION" \
            --arg minimum_php "8.2.0" \
            --arg artifact "$ARTIFACT" \
            --arg sha256 "$SHA256" \
            --arg commit "$GITHUB_SHA" \
            '{
              version: $version,
              minimum_version: $minimum_version,
              minimum_php: $minimum_php,
              channel: "stable",
              artifact: $artifact,
              sha256: $sha256,
              commit: $commit,
              has_migrations: true,
              requires_backup: true,
              estimated_downtime_seconds: 60
            }' > release-assets/update-manifest.json

          echo "artifact=release-assets/$ARTIFACT" >> "$GITHUB_OUTPUT"

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          test -s release-assets/update-manifest.json
          test -s "${{ steps.package.outputs.artifact }}"
          jq -e '.version and .artifact and .sha256 and .minimum_version and .minimum_php' release-assets/update-manifest.json >/dev/null

      - name: Attest application package
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: |
            ${{ steps.package.outputs.artifact }}
            release-assets/update-manifest.json

      - name: Create or reuse draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASES_JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100")"
          RELEASE_JSON="$(printf '%s\n' "$RELEASES_JSON" | jq -c \
            --arg tag "$GITHUB_REF_NAME" \
            '[.[] | select(.tag_name == $tag)][0] // empty')"

          if [[ -n "$RELEASE_JSON" ]]; then
            RELEASE_STATE="$(printf '%s\n' "$RELEASE_JSON" | jq -r '.draft')"
            ASSET_COUNT="$(printf '%s\n' "$RELEASE_JSON" | jq '.assets | length')"

            if [[ "$RELEASE_STATE" != "true" ]]; then
              echo "::error::A published release already exists for $GITHUB_REF_NAME."
              exit 1
            fi

            if [[ "$ASSET_COUNT" -eq 0 ]]; then
              echo "Removing the empty draft release so it can be recreated atomically."
              gh release delete "$GITHUB_REF_NAME" --yes
            else
              echo "Reusing the existing draft release for $GITHUB_REF_NAME."
            fi
          fi

          if [[ -z "$RELEASE_JSON" || "$ASSET_COUNT" -eq 0 ]]; then
            # Attach assets during creation. Immutable-release repositories reject
            # a later `gh release upload` request.
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --draft \
              --title "EcclesiaOS $GITHUB_REF_NAME" \
              --generate-notes \
              release-assets/*
          else
            echo "The existing draft release already has assets; no upload is attempted."
          fi

      - name: Verify draft GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_JSON="$(gh release view "$GITHUB_REF_NAME" --json assets)"
          printf '%s\n' "$RELEASE_JSON" | jq -e '
            .assets
            | map(.name)
            | any(. == "update-manifest.json")
            and any(test("^ecclesiaos-v.*\\.zip$"))
          ' >/dev/null

      - name: Publish verified GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$GITHUB_REF_NAME" \
            --draft=false \
            --latest

      - name: Verify published GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_JSON="$(gh release view "$GITHUB_REF_NAME" --json assets,isDraft,isPrerelease)"
          printf '%s\n' "$RELEASE_JSON" | jq -e '
            (.isDraft | not)
            and (.isPrerelease | not)
            and (
              .assets
              | map(.name)
              | any(. == "update-manifest.json")
              and any(test("^ecclesiaos-v.*\\.zip$"))
            )
          ' >/dev/null
