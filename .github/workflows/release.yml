name: Publish Application Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: ctype, curl, dom, fileinfo, filter, mbstring, openssl, pdo_sqlite, session, tokenizer, xml, zip
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Verify tag and version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          test "$VERSION" = "$(tr -d '\r\n' < VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]

      - name: Install development dependencies
        run: |
          composer install --no-interaction --prefer-dist
          npm ci

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Verify application
        run: |
          composer audit --locked
          npm audit
          php artisan test
          ./vendor/bin/pint --test
          npm run build

      - name: Install production PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Build release package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          ARTIFACT="ecclesiaos-v${VERSION}.zip"
          STAGE="$RUNNER_TEMP/ecclesiaos-release"
          mkdir -p "$STAGE" release-assets

          rsync -a ./ "$STAGE/" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='storage/' \
            --exclude='public/storage' \
            --exclude='database/*.sqlite*' \
            --exclude='release-assets/' \
            --exclude='.phpunit.result.cache'

          find "$STAGE/bootstrap/cache" -type f ! -name '.gitignore' -delete
          (cd "$STAGE" && zip -q -r "$GITHUB_WORKSPACE/release-assets/$ARTIFACT" .)

          SHA256="$(sha256sum "release-assets/$ARTIFACT" | awk '{print $1}')"
          MINIMUM_VERSION="$(tr -d '\r\n' < release/minimum-version.txt)"

          jq -n \
            --arg version "$VERSION" \
            --arg minimum_version "$MINIMUM_VERSION" \
            --arg minimum_php "8.2.0" \
            --arg artifact "$ARTIFACT" \
            --arg sha256 "$SHA256" \
            --arg commit "$GITHUB_SHA" \
            '{
              version: $version,
              minimum_version: $minimum_version,
              minimum_php: $minimum_php,
              channel: "stable",
              artifact: $artifact,
              sha256: $sha256,
              commit: $commit,
              has_migrations: true,
              requires_backup: true,
              estimated_downtime_seconds: 60
            }' > release-assets/update-manifest.json

          echo "artifact=release-assets/$ARTIFACT" >> "$GITHUB_OUTPUT"

      - name: Attest application package
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ${{ steps.package.outputs.artifact }}
            release-assets/update-manifest.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            release-assets/* \
            --verify-tag \
            --title "EcclesiaOS $GITHUB_REF_NAME" \
            --generate-notes
